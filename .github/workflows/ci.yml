name: CI Pipeline

on:
  push:
    branches:
      - branch-2026
    tags:
      - '*'

jobs:
  test_app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: section-07-ci-and-publishing/house-prices-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tox
        run: pip install tox
      - name: Run app tests
        run: tox -e test_app
        env:
          PIP_EXTRA_INDEX_URL: ${{ secrets.GEMFURY_DEPLOY_URL }}

  deploy_app_to_railway:
    needs: test_app
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/branch-2026'
    defaults:
      run:
        working-directory: section-07-ci-and-publishing/house-prices-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Railway CLI
        run: npm i -g @railway/cli
      - name: Deploy to Railway
        run: railway up --detach --service=house-price-api
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  test_and_upload_regression_model:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    defaults:
      run:
        working-directory: section-07-ci-and-publishing/model-package
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tox
        run: pip install tox
      - name: Fetch data from Kaggle
        run: tox -e fetch_data
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      - name: Test the model
        run: tox
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      - name: Publish model to Gemfury
        run: tox -e publish_model
        env:
          GEMFURY_PUSH_URL: ${{ secrets.GEMFURY_PUSH_URL }}

  deploy_container_via_railway:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/branch-2026'
    defaults:
      run:
        working-directory: section-08-deploying-with-containers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Railway CLI
        run: npm i -g @railway/cli
      - name: Deploy container to Railway
        run: railway up --detach --service=house-price-api
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
